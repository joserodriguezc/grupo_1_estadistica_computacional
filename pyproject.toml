version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "José Ignacio Rodríguez", email = "69468130+joserodriguezc@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
