    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

#[project.scripts]
#grupo-1-estadistica-computacional = "grupo_1_estadistica_computacional:main"

